name: Build UEFI for moto g57 power (mumba)
on:
  push:
    branches: ["main"]
    paths:
      - 'Platforms/Motorola/mumbaPkg/**'
      - 'Resources/DTBs/mumba.dtb'
      - 'Resources/Configs/mumba.toml'
      - 'Silicon/Qualcomm/NetraniPkg/**'
      - '.github/workflows/mumba.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up build environment
        run: bash ./setup_env.sh -p apt
      - name: Build mumba UEFI
        run: python3 build_uefi.py -d mumba -r DEBUG
      - name: Upload UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: mumba-uefi
          path: ./Mu-*
